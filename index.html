<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Агент 777</title>
  <meta name="theme-color" content="#0B0E13">
  <style>
    :root { color-scheme: dark; --bg:#0B0E13; --card:#151B25; --line:#26303F; --text:#EDF1F7; --muted:#93A0B2; --accent:#FFC44D; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(900px 500px at 50% 0,#1A2331,var(--bg) 65%); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    main { width:min(680px,100%); padding:32px; background:var(--card); border:1px solid var(--line); border-radius:20px; }
    .brand { color:var(--accent); font-size:12px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-size:clamp(28px,6vw,42px); line-height:1.15; }
    p { color:var(--muted); }
    a { display:inline-block; margin-top:12px; padding:12px 16px; border-radius:10px; background:var(--accent); color:#1A1204; font-weight:700; text-decoration:none; }
    a:hover { filter:brightness(1.05); }
    footer { margin-top:22px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
<main>
  <div class="brand">Агент 777</div>
  <h1>Тренажёр памяти и внимания</h1>
  <p>Документы приложения для RuStore и Google Play.</p>
  <a href="./privacy/">Политика конфиденциальности</a>
  <footer>© 2026 Агент 777 · ru.nomer.trainer</footer>
</main>
</body>
</html>
